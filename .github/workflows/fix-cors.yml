name: Fix production CORS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Vercel preview CORS regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/server.py")
          s = p.read_text()
          needle = '    allow_origins=[x.strip() for x in os.environ.get("CORS_ORIGINS", _DEFAULT_CORS_ORIGINS).split(",") if x.strip()],\n'
          replacement = needle + '    allow_origin_regex=r"^https://sih-project-[a-z0-9-]+-diabetes\\.vercel\\.app$",\n'
          if 'allow_origin_regex=r"^https://sih-project-' in s:
              raise SystemExit(0)
          if needle not in s:
              raise SystemExit("expected CORS allow_origins line not found")
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: allow Vercel preview domains in CORS'
          git push
